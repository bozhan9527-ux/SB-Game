# Cloudflare Worker：雲端存檔、排行榜、百分位。
#
# 為什麼是 Cloudflare：這個專案本來就是一包靜態檔案，Workers 的免費額度
# （每日十萬請求）在有遙測數字之前不可能用完，而存檔本來就是單一可序列化物件，
# D1 一張表就裝得下（TECH_SPEC 第 9 節從第一天就是這樣設計的）。
name = "sb-game-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 部署前要先建資料庫並把 database_id 填進來：
#   npx wrangler d1 create sb-game
#   npx wrangler d1 execute sb-game --remote --file=server/schema.sql
[[d1_databases]]
binding = "DB"
database_name = "sb-game"
database_id = "ee71254c-afda-4dbe-b8a7-21e0dd465f92"

# CPU 上限。
#
# **上線前要確認這件事。** 上榜的驗證是伺服器把整場戰鬥重跑一遍，實測
# 一般通關約 40 毫秒 CPU、跑滿 MAX_REPLAY_STEPS 的一場約 1.5 秒——
# 而 Workers **免費方案每次呼叫只有 10 毫秒 CPU**，付費才是 30 秒。
# 照那個數字，免費方案下每一筆成績都會超上限。
#
# 這裡刻意不直接寫上 [limits]：那個區塊是付費方案的功能，在免費方案上
# 寫死它可能讓部署整個失敗，而那比慢一點糟得多。確認是付費方案之後，
# 把下面兩行取消註解——把上限寫明白，比依賴預設值好，因為預設值會變。
#
# [limits]
# cpu_ms = 30000

[vars]
# 允許哪些來源呼叫。部署到自己的網域時要改這裡。
ALLOWED_ORIGIN = "https://bozhan9527-ux.github.io"
