name: Stats

# 「目前有多少人玩過？」
#
# 這個問題本來只能自己開終端機打 wrangler，而那表示它不會有人常常去問。
# 做成 Actions 頁面上的一顆按鈕，數字直接印在 log 裡。
#
# 查詢寫在 server/stats.sql，只有 COUNT、沒有任何一列原始資料——
# accounts 裡的信箱是這個專案唯一存下來的個人資料，而這裡的 log 是公開的。
on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # **這一步不能省。** 沒有它的話 wrangler-action 會自己去裝一份 wrangler，
      # 而那會撞上 peer 依賴衝突（repo 用 @cloudflare/workers-types@5，
      # wrangler 3.90 的 peerOptional 寫的是 ^4）。npm ci 走鎖檔、不理 peer。
      - run: npm ci

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: d1 execute sb-game --remote --file=stats.sql --yes
