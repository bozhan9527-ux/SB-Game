name: Deploy

# TECH_SPEC 第 5 節：型別檢查與測試必須在部署前擋關。
on:
  push:
    branches: [main]
  # 開發分支尚未併入 main 時，可在 Actions 頁面手動觸發一次部署做手機實測。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，後推的取代排隊中的（但不中斷進行中的）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # 遙測的 project key。PostHog 的 project key 本來就是公開的（它會出現在前端的
      # JS 裡），放進 secret 不是為了保密，是為了讓不同的部署指向不同的專案。
      # 沒設定時 build 出來的版本完全不連網：posthog-js 被切成獨立的 chunk，
      # 沒有金鑰就永遠不會被下載。
      # 建置吃到什麼設定，log 裡要看得見。少了 VITE_API_BASE 的版本不會報錯，
      # 只會安靜地少掉雲端存檔與榜單——那種故障從畫面上看像是「功能沒做」。
      # 值透過 env 傳進來再用 shell 展開，不直接插進腳本裡。
      - name: Report build config
        env:
          API_BASE: ${{ vars.VITE_API_BASE }}
          PH_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          echo "VITE_API_BASE   = ${API_BASE:-(未設定)}"
          echo "VITE_POSTHOG_KEY 長度 = ${#PH_KEY}"

      - name: Build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # 後端位址。沒設定時雲端存檔／排行榜的畫面整個不出現，遊戲照常可玩。
          # 它是變數不是密鑰——這個位址本來就會出現在前端的 JS 裡。
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      # 註：不使用 enablement: true 自動啟用 Pages。實測 GITHUB_TOKEN 無此權限
      # （Create Pages site failed: Resource not accessible by integration），
      # Pages 的 Source 必須先在 repo 設定頁手動切為 GitHub Actions。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
