name: Deploy

# TECH_SPEC 第 5 節：型別檢查與測試必須在部署前擋關。
on:
  push:
    branches: [main]
  # 開發分支尚未併入 main 時，可在 Actions 頁面手動觸發一次部署做手機實測。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，後推的取代排隊中的（但不中斷進行中的）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 註：不使用 enablement: true 自動啟用 Pages。實測 GITHUB_TOKEN 無此權限
      # （Create Pages site failed: Resource not accessible by integration），
      # Pages 的 Source 必須先在 repo 設定頁手動切為 GitHub Actions。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
