<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1328" />
    <!-- 內嵌 favicon（16×16 像素劍，和遊戲同色盤），避免瀏覽器對 /favicon.ico 發出 404 請求 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230f1328'/%3E%3Crect x='7' y='1' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='6' y='2' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='2' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='3' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='3' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='4' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='4' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='5' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='5' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='6' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='6' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='7' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='7' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='8' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='8' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='6' y='9' width='1' height='1' fill='%23fff2bf'/%3E%3Crect x='7' y='9' width='2' height='1' fill='%23e8c46a'/%3E%3Crect x='4' y='10' width='7' height='1' fill='%237fdba0'/%3E%3Crect x='7' y='11' width='1' height='1' fill='%236b4a2a'/%3E%3Crect x='7' y='12' width='1' height='1' fill='%236b4a2a'/%3E%3Crect x='7' y='13' width='1' height='1' fill='%237fdba0'/%3E%3C/svg%3E"
    />
    <title>問道飛升</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 桌機上遊戲兩側會空出一大片：鋪一層和遊戲同色系的 4px 棋盤格，外圈壓暗，
           看起來是同一個世界的延伸，而不是頁面沒載入完。手機上幾乎看不到。 */
        background:
          radial-gradient(ellipse at center, rgba(7, 9, 18, 0) 35%, #070912 100%),
          repeating-conic-gradient(#131838 0 25%, #0f1328 0 50%) 0 0 / 8px 8px;
        background-color: #0f1328;
        /* 觸控遊戲：關閉瀏覽器的手勢攔截，否則拖曳符牌會被下拉刷新／選字吃掉 */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        /* 畫布縮放到螢幕大小時也不做平滑，否則像素會糊成一片。 */
        image-rendering: pixelated;
        /* 和遊戲裡的面板同一種框：深色外框加一圈線色。 */
        box-shadow:
          0 0 0 3px #12141c,
          0 0 0 6px #3a427a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
