<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#d9ccb0" />
    <!-- 內嵌 favicon（一張黃符），避免瀏覽器對 /favicon.ico 發出 404 請求 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='1' width='10' height='14' rx='1' fill='%23efd27a' stroke='%232a2622'/%3E%3Cpath d='M8 3v3M6 5c1 1 3 1 4 0M6.5 8.5l3 0M8 7v6' stroke='%23c8372d' stroke-width='1.2' fill='none'/%3E%3C/svg%3E"
    />
    <title>問道飛升</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 桌機上遊戲兩側會空出一大片：當成一張書桌，遊戲是攤在桌上的手札，
           外圈壓暗，看起來是同一個世界的延伸，而不是頁面沒載入完。手機上幾乎看不到。 */
        background:
          radial-gradient(ellipse at center, rgba(40, 26, 14, 0) 40%, rgba(40, 26, 14, 0.55) 100%),
          repeating-linear-gradient(90deg, #b89a72 0 3px, #b3946b 3px 7px, #bb9d76 7px 12px);
        background-color: #b89a72;
        /* 觸控遊戲：關閉瀏覽器的手勢攔截，否則拖曳符牌會被下拉刷新／選字吃掉 */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        /* 手札落在桌上的影子。 */
        box-shadow: 0 6px 24px rgba(40, 26, 14, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
